
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Analysis Dashboard</title>
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        #app-container { display: flex; flex-direction: row; height: 100vh; width: 100vw; overflow: hidden; }
        #chart { flex-grow: 1; min-width: 0; }
        #side-panel { 
            width: 320px; background-color: #111; border-left: 1px solid #333; 
            padding: 15px; overflow-y: auto; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .metric-box { margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .metric-title { font-size: 10px; color: cyan; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-size: 20px; font-weight: bold; margin-top: 2px; }
        .city-name { font-size: 22px; color: #fff; margin-bottom: 15px; border-bottom: 2px solid cyan; padding-bottom: 8px; }
        .formula { font-size: 9px; color: #666; font-style: italic; display: block; margin-top: 2px; }
        
        /* Map Legend */
        .legend-box { margin-top: auto; padding-top: 20px; border-top: 2px solid #444; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 11px; color: #aaa; }
        .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        
        @media (max-width: 768px) {
            #app-container { flex-direction: column; overflow: auto; height: auto; }
            #chart { height: 60vh; width: 100%; }
            #side-panel { width: 100%; border-left: none; border-top: 1px solid cyan; height: auto; }
            .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .metric-box { margin-bottom: 0; border-bottom: none; background: #222; padding: 10px; border-radius: 4px; }
            .legend-box { display: none; }
        }
    </style>
</head>

    <script>
        var gd = document.getElementsByClassName('plotly-graph-div')[0];
        gd.on('plotly_click', function(data){
            var p = data.points[0];
            var price = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact' }).format(p.customdata[2]);
            var content = document.getElementById('card-content');
            content.innerHTML = `
                <div class="city-name">${p.text}</div>
                <div class="metric-grid">
                    <div class="metric-box">
                        <div class="metric-title">Median Home Value</div>
                        <div class="metric-value">${price}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Avg Appreciation (6yr)</div>
                        <div class="metric-value">${p.customdata[4].toFixed(1)}%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Avg Pop Growth (4yr)</div>
                        <div class="metric-value">${p.customdata[3].toFixed(1)}%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Avg Days on Market (33 healthy)</div>
                        <div class="metric-value">${p.customdata[0].toFixed(0)}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Scarcity Ratio (Node Size)</div>
                        <span class="formula">Total Pop / Current Inventory</span>
                        <div class="metric-value">${p.customdata[1].toFixed(1)}</div>
                    </div>
                </div>
            `;
        });
    </script>
